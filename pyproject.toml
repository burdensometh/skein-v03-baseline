[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skein"
version = "0.3.0"
description = "Polite, incremental web harvesting on the Python standard library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
skein = "skein.cli:main"

[tool.setuptools.packages.find]
include = ["skein*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
